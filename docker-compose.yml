volumes:
    mariadb-10-11-data:
    redis-data:
    mailpit-data:

services:
    web:
        image: ceskakrutacz
        build:
            context: .
            target: dev
        restart: unless-stopped
        tty: true
        volumes:
            - .:/app
            - .docker/on-startup.sh:/docker-entrypoint.d/on-startup.sh
        depends_on:
            - mariadb
        ports:
            - "${WEB_PORT:-8080}:8080"
        environment:
            XDEBUG_CONFIG: "client_host=host.docker.internal"
            XDEBUG_MODE: debug
            PHP_IDE_CONFIG: "serverName=ceskakruta"

    mariadb:
        image: mariadb:10.11
        restart: unless-stopped
        environment:
          MYSQL_ROOT_PASSWORD: "root"
          MYSQL_DATABASE: "ceskakruta"
        volumes:
          - mariadb-10-11-data:/var/lib/mysql
        ports:
          - "${DB_PORT:-3306}:3306"

    js-watch:
        image: ceskakrutacz
        volumes:
            - .:/app
        restart: unless-stopped
        entrypoint: [""]
        command: ["bash", "-c", "npm install && npm run watch"]
        tty: true

    adminer:
        image: adminer:4.8.0
        ports:
            - "${ADMINER_PORT:-8000}:8080"
        environment:
            ADMINER_DEFAULT_SERVER: mariadb
        depends_on:
            - mariadb

    mailer:
        image: axllent/mailpit
        ports:
            - "${MAILER_SMTP_PORT:-1025}:1025"
            - "${MAILER_UI_PORT:-8025}:8025"
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
            MP_DATABASE: "/data/mailpit.db"
        volumes:
            - mailpit-data:/data
